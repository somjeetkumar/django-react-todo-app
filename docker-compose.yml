services:

  backend:
    build: ./drf-react-todolist
    container_name: django-backend
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - mysql
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  frontend:
    build: ./client
    container_name: react-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

  redis:
    image: redis:7
    container_name: redis-server
    ports:
      - "6379:6379"

  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3306:3306"
    
    environment:
      MYSQL_DATABASE: todo_db
      MYSQL_USER: django_user
      MYSQL_PASSWORD: django_password
      MYSQL_ROOT_PASSWORD: django_password

    volumes:
    - mysql_data:/var/lib/mysql

volumes:
  mysql_data: